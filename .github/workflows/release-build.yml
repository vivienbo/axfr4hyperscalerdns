name: Release Build

on:
  push:
    tags:
      - 'v*'  # Run when a version tag like v1.0.0 is pushed

jobs:
  build-release:
    name: Build & Package Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Release with Dependencies
        run: mvn clean install -DwithResolver -B
        
      - name: Publish Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: target/*.jar
          tag: ${{ github.ref }}
          overwrite: true

